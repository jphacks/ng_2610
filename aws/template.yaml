AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nigeyo training and live regional APNs for one opted-in iPhone.

Parameters:
  WorkerImage:
    Type: String
    Description: ECR image URI pinned to a digest.
    Default: ''
    AllowedPattern: '^(|.+@sha256:[0-9a-f]{64})$'
  LiveSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^(|arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+)$'
  VpcId:
    Type: String
    Default: ''
    AllowedPattern: '^(|vpc-([0-9a-f]{8}|[0-9a-f]{17}))$'
  PublicSubnet:
    Type: String
    Default: ''
    AllowedPattern: '^(|subnet-([0-9a-f]{8}|[0-9a-f]{17}))$'
    Description: Subnet in the VPC with an Internet Gateway route.
  LiveEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  APNsSecretArn:
    Type: String
    Description: Full ARN of the existing Secrets Manager secret in this account and region.
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  OperatorRoleName:
    Type: String
    Description: Name of the existing IAM role used by the demo operator.
    AllowedPattern: '^[a-zA-Z0-9_+=,.@-]{1,64}$'

Rules:
  RequireLiveParameters:
    RuleCondition: !Or
      - !Equals [!Ref LiveEnabled, 'true']
      - !Not [!Equals [!Ref WorkerImage, '']]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref WorkerImage, '']]
          - !Not [!Equals [!Ref LiveSecretArn, '']]
          - !Not [!Equals [!Ref VpcId, '']]
          - !Not [!Equals [!Ref PublicSubnet, '']]
        AssertDescription: Set WorkerImage, LiveSecretArn, VpcId and PublicSubnet to configure live monitoring.

Conditions:
  ConfigureLiveMonitoring: !Not [!Equals [!Ref WorkerImage, '']]
  EnableLiveMonitoring: !Equals [!Ref LiveEnabled, 'true']

Resources:
  TrainingPush:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: apns-training/
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 12
      Environment:
        Variables:
          APNS_SECRET_ARN: !Ref APNsSecretArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref APNsSecretArn

  OperatorInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-invoke-training-push'
      Roles:
        - !Ref OperatorRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt TrainingPush.Arn

  Cluster:
    Condition: ConfigureLiveMonitoring
    Type: AWS::ECS::Cluster
  WorkerSecurityGroup:
    Condition: ConfigureLiveMonitoring
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Regional worker outbound connections only
      VpcId: !Ref VpcId
  RegionalState:
    Condition: ConfigureLiveMonitoring
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  WorkerLogs:
    Condition: ConfigureLiveMonitoring
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  ExecutionRole:
    Condition: ConfigureLiveMonitoring
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  WorkerRole:
    Condition: ConfigureLiveMonitoring
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref LiveSecretArn
              # GetObject returns NoSuchKey on first boot only with ListBucket permission.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RegionalState.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${RegionalState.Arn}/regional-monitor.json'
  WorkerTask:
    Condition: ConfigureLiveMonitoring
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerRole.Arn
      ContainerDefinitions:
        - Name: regional-worker
          Image: !Ref WorkerImage
          Essential: true
          ReadonlyRootFilesystem: true
          Environment:
            - {Name: APNS_SECRET_ARN, Value: !Ref LiveSecretArn}
            - {Name: STATE_BUCKET, Value: !Ref RegionalState}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: regional-worker
  WorkerService:
    Condition: ConfigureLiveMonitoring
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTask
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !If [EnableLiveMonitoring, 1, 0]
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref WorkerSecurityGroup]
          Subnets: [!Ref PublicSubnet]

Outputs:
  ClusterName:
    Condition: ConfigureLiveMonitoring
    Value: !Ref Cluster
  ServiceName:
    Condition: ConfigureLiveMonitoring
    Value: !GetAtt WorkerService.Name
  TrainingPushFunctionName:
    Value: !Ref TrainingPush
